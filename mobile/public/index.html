<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <!-- Web template for `expo export --platform web` (web.output "single") and the web dev server.
         Expo reads public/index.html instead of its built-in template and injects the bundle script. -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets safe-area insets reach the app; maximum-scale=1 stops iOS
         Safari from zooming in when a text field is focused. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Last Call</title>
    <meta name="description" content="Good food from local bakeries, cafes and restaurants, for less. Limited quantity: reserve, pick up before close and pay in store." />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Add to Home Screen on iPhone: full-screen app, dark status bar text on the white background. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Last Call" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #FFFFFF;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
